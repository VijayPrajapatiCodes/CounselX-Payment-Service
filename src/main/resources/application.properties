spring.application.name=payment-service

server.port=8082

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=YOUR_RDS_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cashfree Payment Gateway - Production
cashfree.base-url=https://api.cashfree.com/pg
cashfree.api-version=2025-01-01
cashfree.client-id=YOUR_CASHFREE_CLIENT_ID
cashfree.client-secret=YOUR_CASHFREE_CLIENT_SECRET

# Cashfree redirects the customer back here after checkout.
# Must be HTTPS in Production.
cashfree.return-url=https://web.nexorachat.online/payment/result

# Optional but recommended for production webhooks.
# This URL must be publicly reachable over HTTPS and routed to this service.
# Example after your reverse proxy/API routing is ready:
# cashfree.notify-url=https://api.nexorachat.online/api/payments/webhooks/cashfree
cashfree.notify-url=

management.endpoints.web.exposure.include=health,info
